[package]
name = "monopoly"
version = "0.1.0"
description = "On-chain program for the Monopoly-on-Solana game (provably-fair rounds)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "monopoly"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
