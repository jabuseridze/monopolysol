# Render blueprint for the realtime coordinator (persistent Node process).
# The web frontend deploys separately to Vercel.
services:
  - type: web
    name: monopoly-sol-coordinator
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm i -g pnpm@9.15.0 && pnpm install --frozen-lockfile && pnpm --filter server build
    startCommand: pnpm --filter server start
    healthCheckPath: /health
    envVars:
      - key: RPC_URL
        value: https://api.devnet.solana.com
      - key: PROGRAM_ID
        sync: false
      - key: AUTHORITY_KEYPAIR
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PORT
        value: 4000
      # REQUIRED. Derives every round's commit-reveal seed (server/src/secrets.ts).
      # Generate with `openssl rand -hex 32`. As sensitive as the authority key:
      # whoever holds it can predict every future roll. Must stay STABLE --
      # rotating it mid-round strands that round's commit.
      - key: MASTER_SECRET
        sync: false
      # SPL mint players must hold. Omit to run with the gate disabled.
      - key: GATE_MINT
        sync: false
      # Spend caps for coordinator-funded picks (server/src/guessIntake.ts).
      # The house pays ~0.0013 SOL of rent per guess, so these bound how much a
      # burst can cost before the sweeper reclaims it.
      - key: MAX_PICKS_PER_ROUND
        value: 500
      - key: AUTHORITY_MIN_BALANCE_SOL
        value: 1
      - key: MAX_GUESSES_PER_SOCKET
        value: 5
